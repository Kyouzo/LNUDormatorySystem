ServerName localhost

RedirectMatch 302 ^/$ /login/login.html

# Render terminates TLS; tell PHP the request was HTTPS (bootstrap.php reads $_SERVER['HTTPS']).
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Free tier has 512 MB RAM shared with MariaDB.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 3
    MaxRequestWorkers 12
    MaxConnectionsPerChild 500
</IfModule>
