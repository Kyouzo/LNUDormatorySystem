  <main class="main-content" id="main-content">
    <section class="hero-band dorm-hero" data-hero aria-labelledby="page-title">
      <span class="eyebrow">Account</span>
      <h1 id="page-title">Settings</h1>
      <p>Signed in as <strong data-me-name>…</strong> · <span data-me-role>Security Personnel</span></p>
    </section>

    <p class="page-alert" id="page-alert" role="alert" hidden></p>

    <section class="panel" aria-labelledby="pw-title">
      <div class="panel-head"><div><span class="eyebrow">Security</span><h2 id="pw-title">Change password</h2><p>Use at least 8 characters. You stay signed in on this device.</p></div></div>
      <form class="settings-form" id="pw-form" novalidate>
        <div class="form-alert" id="pw-alert" role="alert" aria-live="assertive"></div>
        <div class="form-grid">
          <div class="field">
            <label for="current_password">Current password</label>
            <span class="input-affix">
              <input type="password" id="current_password" name="current_password" autocomplete="current-password" maxlength="1024" required aria-describedby="current_password-error">
              <button class="affix-button" type="button" data-password-toggle aria-controls="current_password" aria-pressed="false" aria-label="Show password" hidden><span data-toggle-label>Show</span></button>
            </span>
            <span class="field-error" id="current_password-error"></span>
          </div>
          <div class="field">
            <label for="new_password">New password</label>
            <span class="input-affix">
              <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" maxlength="1024" required aria-describedby="new_password-error">
              <button class="affix-button" type="button" data-password-toggle aria-controls="new_password" aria-pressed="false" aria-label="Show password" hidden><span data-toggle-label>Show</span></button>
            </span>
            <span class="field-error" id="new_password-error"></span>
          </div>
          <div class="field">
            <label for="confirm_password">Confirm new password</label>
            <span class="input-affix">
              <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" maxlength="1024" required aria-describedby="confirm_password-error">
              <button class="affix-button" type="button" data-password-toggle aria-controls="confirm_password" aria-pressed="false" aria-label="Show password" hidden><span data-toggle-label>Show</span></button>
            </span>
            <span class="field-error" id="confirm_password-error"></span>
          </div>
        </div>
        <button class="button primary" type="submit" id="pw-submit">Update password</button>
      </form>
    </section>
