<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#00006e" />
    <title>Settings | LNU Dorm Administrator</title>
    <meta
      name="description"
      content="Account settings: change your password."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../../assets/css/portal.css" />
    <link rel="stylesheet" href="../violations.css" />
    <link rel="stylesheet" href="admin.css" />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"
    ></script>
    <script src="../../assets/js/portal.js"></script>
  </head>
  <body data-admin-page="settings">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" data-admin-sidebar></aside>

      <main class="main-content" id="main-content">
        <section
          class="hero-band staff-hero"
          data-hero
          aria-labelledby="page-title"
        >
          <span class="eyebrow">Account</span>
          <h1 id="page-title">Settings</h1>
          <p class="hero-meta">
            <span
              >Signed in as <strong data-admin-name>Administrator</strong></span
            ><span>Role <strong>Dorm Administrator</strong></span>
          </p>
          <p class="hero-alert" id="page-alert" role="alert" hidden></p>
        </section>

        <div class="content-stack">
          <section class="panel" aria-labelledby="pw-title">
            <div class="panel-head">
              <div>
                <span class="eyebrow">Security</span>
                <h2 id="pw-title">Change password</h2>
                <p>
                  Use at least 8 characters. You stay signed in after changing
                  it.
                </p>
              </div>
            </div>
            <form id="pw-form" class="settings-form" novalidate>
              <div class="form-alert" id="pw-alert" role="alert"></div>
              <label class="field" for="pw-current"
                >Current password
                <span class="password-wrap"
                  ><input
                    id="pw-current"
                    type="password"
                    autocomplete="current-password"
                    required
                    aria-describedby="pw-current-error"
                  />
                  <button
                    class="toggle"
                    type="button"
                    data-password-toggle
                    aria-controls="pw-current"
                    aria-pressed="false"
                    aria-label="Show password"
                    hidden
                  >
                    <span data-toggle-label>Show</span>
                  </button></span
                >
                <span class="field-error" id="pw-current-error"></span>
              </label>
              <label class="field" for="pw-new"
                >New password
                <span class="password-wrap"
                  ><input
                    id="pw-new"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                    aria-describedby="pw-new-hint pw-new-error"
                  />
                  <button
                    class="toggle"
                    type="button"
                    data-password-toggle
                    aria-controls="pw-new"
                    aria-pressed="false"
                    aria-label="Show password"
                    hidden
                  >
                    <span data-toggle-label>Show</span>
                  </button></span
                >
                <span class="field-hint" id="pw-new-hint"
                  >At least 8 characters, different from the current one.</span
                >
                <span class="field-error" id="pw-new-error"></span>
              </label>
              <label class="field" for="pw-confirm"
                >Confirm new password
                <span class="password-wrap"
                  ><input
                    id="pw-confirm"
                    type="password"
                    autocomplete="new-password"
                    required
                    aria-describedby="pw-confirm-error"
                  />
                  <button
                    class="toggle"
                    type="button"
                    data-password-toggle
                    aria-controls="pw-confirm"
                    aria-pressed="false"
                    aria-label="Show password"
                    hidden
                  >
                    <span data-toggle-label>Show</span>
                  </button></span
                >
                <span class="field-error" id="pw-confirm-error"></span>
              </label>
              <div class="actions">
                <button class="button primary" type="submit" id="pw-submit">
                  Update password
                </button>
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>

    <script src="../../assets/js/api.js"></script>
    <script src="admin.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
