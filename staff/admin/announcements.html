<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#00006e">
  <title>Announcements | LNU Dorm Administrator</title>
  <meta name="description" content="Post announcements to dormers and security personnel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../../assets/css/portal.css">
  <link rel="stylesheet" href="../violations.css">
  <link rel="stylesheet" href="admin.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <script src="../../assets/js/portal.js"></script>
</head>
<body data-admin-page="announcements">
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" data-admin-sidebar></aside>

  <main class="main-content" id="main-content">
    <section class="hero-band staff-hero" data-hero aria-labelledby="page-title">
      <span class="eyebrow">Notice board</span>
      <h1 id="page-title">Announcements</h1>
      <p>Posts appear on every dormer's dashboard and notification bell, and on the security personnel home page.</p>
      <p class="hero-alert" id="page-alert" role="alert" hidden></p>
    </section>

    <div class="content-stack">
      <section class="panel" aria-labelledby="new-title">
        <div class="panel-head">
          <div>
            <span class="eyebrow">New post</span>
            <h2 id="new-title">Enter announcements</h2>
          </div>
        </div>
        <form id="announce-form" class="form-grid" novalidate>
          <div class="form-alert" id="announce-alert" role="alert" style="grid-column:1/-1"></div>
          <label class="field full" for="a-title">Title <span class="field-hint">(optional)</span>
            <input id="a-title" name="title" maxlength="150" autocomplete="off" placeholder="e.g. Room cleaning">
          </label>
          <label class="field full" for="a-body">Announcement
            <textarea id="a-body" name="body" maxlength="2000" required rows="5" placeholder="Floor 3 Room 1 and 3 please clean your rooms" aria-describedby="a-count a-body-error"></textarea>
            <span class="field-hint count-hint" id="a-count" aria-live="polite">0 / 2000</span>
            <span class="field-error" id="a-body-error"></span>
          </label>
          <div class="actions" style="grid-column:1/-1"><button class="button primary" type="submit" id="a-submit">Submit announcements</button></div>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <div class="panel-head">
          <div>
            <span class="eyebrow">History</span>
            <h2 id="list-title">Previous announcements</h2>
          </div>
          <button class="button outline small" type="button" data-retry="list">Refresh</button>
        </div>
        <div id="a-list" aria-live="polite" aria-busy="true">
          <span class="skeleton skeleton-text"></span><span class="skeleton skeleton-text"></span><span class="skeleton skeleton-text short"></span>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="../../assets/js/api.js"></script>
<script src="admin.js"></script>
<script src="announcements.js"></script>
</body>
</html>
